name: Terraform CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: "Deployment action"
        required: true
        default: "plan-and-apply"
        type: choice
        options:
          - plan-only
          - plan-and-apply

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.9.0"
  TF_IN_AUTOMATION: "true"
  ENVIRONMENT: ${{ inputs.environment || 'dev' }}
  BACKEND_RESOURCE_GROUP: "rg-terraform-state-eastus2"
  BACKEND_STORAGE_ACCOUNT: "sttfstategd001"
  BACKEND_CONTAINER: "tfstate"

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Git for Private Child Modules
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "${GH_PAT:-}" ]; then
            git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          else
            echo "::warning::GH_PAT secret is not set. Private gd-child-* modules may fail to clone during terraform init."
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (Stateless)
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate

  plan:
    name: Plan (${{ inputs.environment || 'dev' }})
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Git for Private Child Modules
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "${GH_PAT:-}" ]; then
            git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          if grep -qE 'backend\s+"azurerm"' *.tf; then
            terraform init -input=false \
              -backend-config="resource_group_name=${BACKEND_RESOURCE_GROUP}" \
              -backend-config="storage_account_name=${BACKEND_STORAGE_ACCOUNT}" \
              -backend-config="container_name=${BACKEND_CONTAINER}" \
              -backend-config="key=gd-parent-infra/${ENVIRONMENT}.tfstate" \
              -backend-config="use_azuread_auth=true"
          else
            echo "::warning::No backend \"azurerm\" block found in *.tf; initializing with local backend."
            terraform init -input=false
          fi

      - name: Terraform Plan
        run: |
          VAR_FILE="terraform.tfvars"
          if [ -f "environments/${ENVIRONMENT}.tfvars" ]; then
            VAR_FILE="environments/${ENVIRONMENT}.tfvars"
          fi
          echo "Using variable file: ${VAR_FILE}"
          terraform plan -no-color -input=false -var-file="${VAR_FILE}" -out="${ENVIRONMENT}.tfplan"
          terraform show -no-color "${ENVIRONMENT}.tfplan" > "${ENVIRONMENT}-plan.txt"

      - name: Publish Plan Summary
        run: |
          {
            echo "### Terraform Plan (\`${ENVIRONMENT}\`)"
            echo "\`\`\`"
            tail -n 60 "${ENVIRONMENT}-plan.txt"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Execution Plan
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ENVIRONMENT }}-tfplan
          path: |
            ${{ env.ENVIRONMENT }}.tfplan
            ${{ env.ENVIRONMENT }}-plan.txt
          retention-days: 5

  apply:
    name: Apply (${{ inputs.environment || 'dev' }})
    needs: plan
    if: github.event_name == 'push' || inputs.action == 'plan-and-apply'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Execution Plan
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ENVIRONMENT }}-tfplan

      - name: Configure Git for Private Child Modules
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "${GH_PAT:-}" ]; then
            git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          if grep -qE 'backend\s+"azurerm"' *.tf; then
            terraform init -input=false \
              -backend-config="resource_group_name=${BACKEND_RESOURCE_GROUP}" \
              -backend-config="storage_account_name=${BACKEND_STORAGE_ACCOUNT}" \
              -backend-config="container_name=${BACKEND_CONTAINER}" \
              -backend-config="key=gd-parent-infra/${ENVIRONMENT}.tfstate" \
              -backend-config="use_azuread_auth=true"
          else
            echo "::warning::No backend \"azurerm\" block found in *.tf; initializing with local backend."
            terraform init -input=false
          fi

      - name: Terraform Apply
        run: |
          terraform apply -no-color -input=false "${ENVIRONMENT}.tfplan"

      - name: Summarize Non-Sensitive Outputs
        run: |
          {
            echo "### Deployment Completed (\`${ENVIRONMENT}\`)"
            echo "\`\`\`json"
            terraform output -json | jq 'with_entries(select(.value.sensitive == false))'
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
